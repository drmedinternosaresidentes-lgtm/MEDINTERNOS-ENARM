<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5fa5">
  <title>ENARM | Plataforma de preparación médica</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">+</div>
        <div>
          <strong>ENARM</strong>
          <span>Plataforma médica</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="inicio"><span>⌂</span> Inicio</button>
        <button class="nav-item" data-view="simuladores"><span>▣</span> Simuladores</button>
        <button class="nav-item" data-view="temario"><span>☰</span> Temario</button>
        <button class="nav-item" data-view="progreso"><span>◔</span> Progreso</button>
        <button class="nav-item" data-view="gpc"><span>▤</span> GPC y bibliografía</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="mini-card">
          <span class="mini-label">Objetivo</span>
          <strong>ENARM 2027</strong>
          <small>Preparación de alto rendimiento</small>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
        <div class="topbar-title">
          <span>Preparación médica</span>
          <strong id="pageTitle">Inicio</strong>
        </div>
        <div class="topbar-right">
          <div class="status-dot"></div>
          <span>Modo estudio</span>
        </div>
      </header>

      <section class="content">
        <div id="view-inicio" class="view active-view"></div>
        <div id="view-simuladores" class="view"></div>
        <div id="view-temario" class="view"></div>
        <div id="view-progreso" class="view"></div>
        <div id="view-gpc" class="view"></div>
        <div id="view-simulador" class="view"></div>
        <div id="view-resultados" class="view"></div>
      </section>
    </main>
  </div>

    <div class="mobile-overlay" id="overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  
  <script src="js/datos/cardiologia.js"></script>
  <script src="js/datos/neumologia.js"></script>
  <script src="js/datos/bancos.js"></script>
  <script src="js/simulador.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
